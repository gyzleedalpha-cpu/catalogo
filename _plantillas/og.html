<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0a0908}
.og{position:relative;width:1200px;height:630px;overflow:hidden;
  font-family:Manrope,sans-serif;color:#f4f1ea}
.bg{position:absolute;inset:0;background:url("../img/marca/noche.jpg") center/cover no-repeat;
  transform:scaleX(-1);filter:brightness(.85)}
.velo{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(10,9,8,.97) 0%,rgba(10,9,8,.9) 42%,rgba(10,9,8,.45) 72%,rgba(10,9,8,.25) 100%)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 76px}
.fila{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.sig{width:52px;height:52px;border-radius:12px;background:#e6b843;color:#151005;
  display:grid;place-items:center;font-family:'Archivo Black',sans-serif;font-size:1.4rem}
.marca{font-family:'Archivo Black',sans-serif;font-size:2rem;letter-spacing:-.02em;text-transform:uppercase}
.marca span{color:#e6b843}
h1{font-family:'Archivo Black',sans-serif;font-size:5.4rem;line-height:.96;letter-spacing:-.04em;
  text-transform:uppercase;max-width:13ch}
h1 em{font-style:normal;color:#e6b843}
.pie{display:flex;align-items:center;gap:12px;margin-top:34px;
  font-size:1.02rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#a09a8d}
.pie i{width:8px;height:8px;border-radius:50%;background:#e6b843;display:block}
</style></head><body>
<div class="og">
  <div class="bg"></div><div class="velo"></div>
  <div class="in">
    <div class="fila"><span class="sig">T</span><span class="marca">Tony<span>Shop</span></span></div>
    <h1>Eliges. Pagas. <em>Entras.</em></h1>
    <div class="pie"><i></i>Acceso inmediato por Telegram</div>
  </div>
</div></body></html>
